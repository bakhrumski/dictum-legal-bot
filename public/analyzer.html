<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hujjat tahlili — JuristAI</title>
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
<link rel="stylesheet" href="/css/design-tokens.css">
<style>
:root{
  --gold:#B08442;--gold-lt:#D6B379;--navy:#0E2236;--navy2:#16365A;
  --txt:#1A1410;--txt2:#5b5147;--card:#fff;--bg:#FBF8F2;
  --border:rgba(26,20,16,.12);
  --risk-high:#b3261e;--risk-high-bg:#fdecea;
  --risk-med:#c17a00;--risk-med-bg:#fff3e0;
  --risk-low:#1a7a4a;--risk-low-bg:#e8f5ee;
  --missing:#1565c0;--missing-bg:#e3f0fd;
  --comply:#6a1b9a;--comply-bg:#f5eeff;
  --strength:#2e7d32;--strength-bg:#e8f5e9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;justify-content:space-between;padding:11px 22px;background:var(--navy);color:#F5EFE3;flex-shrink:0}
header .brand{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600}
header b{font-family:'Source Serif 4',Georgia,serif;color:var(--gold-lt)}
.hback{font-size:12px;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.22);padding:5px 13px;border-radius:7px;text-decoration:none}
.hback:hover{background:rgba(255,255,255,.1)}

.split{flex:1;display:flex;min-height:0}
.pane{height:100%;overflow-y:auto}
.pane-left{width:44%;min-width:320px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column}
.pane-right{flex:1;padding:22px 26px 50px;background:var(--bg)}

/* Upload zone */
.upload-section{padding:20px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.upload-section h2{font-family:'Source Serif 4',Georgia,serif;font-size:17px;color:var(--navy);margin-bottom:14px}
.drop-zone{border:2px dashed rgba(176,132,66,.4);border-radius:12px;padding:28px 18px;text-align:center;cursor:pointer;transition:.2s;background:#faf7f2}
.drop-zone:hover,.drop-zone.over{border-color:var(--gold);background:rgba(176,132,66,.05)}
.drop-zone .dz-icon{font-size:28px;margin-bottom:8px}
.drop-zone p{font-size:13px;color:var(--txt2);line-height:1.5}
.drop-zone strong{color:var(--gold)}
.drop-zone input{display:none}
.lang-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--txt2)}
.lang-row label{font-weight:600}
.lang-row select{padding:5px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:#fff;color:var(--txt)}
.ocr-progress{margin-top:10px;display:none}
.ocr-bar-wrap{height:6px;background:#e4ddd4;border-radius:99px;overflow:hidden;margin-top:4px}
.ocr-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-lt));width:0%;transition:.3s;border-radius:99px}
.ocr-label{font-size:11px;color:var(--txt2)}

/* Text section */
.text-section{flex:1;display:flex;flex-direction:column;padding:16px 22px;min-height:0}
.text-section label{font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.char-count{font-weight:400;color:var(--txt2)}
textarea#docText{flex:1;width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;font-family:inherit;resize:none;line-height:1.55;min-height:160px}
textarea#docText:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,132,66,.12)}

/* Analyze button */
.action-bar{padding:14px 22px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:10px}
.btn{padding:9px 20px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--txt);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--navy);color:#F5EFE3;border-color:var(--navy);flex:1;justify-content:center}
.btn.primary:hover{background:var(--navy2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Right: results */
.results-empty{text-align:center;padding:60px 24px;color:var(--txt2)}
.results-empty .icon{font-size:36px;margin-bottom:14px}
.score-header{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:16px}
.score-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.score-info .doc-type{font-family:'Source Serif 4',Georgia,serif;font-size:17px;font-weight:600;color:var(--navy);margin-bottom:4px}
.score-info .summary{font-size:13px;color:var(--txt2);line-height:1.5}
.lang-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(176,132,66,.12);color:var(--gold);text-transform:uppercase;margin-left:8px;vertical-align:middle}

.section-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.section-card h3{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.section-card h3 .cnt{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}

.risk-item{border-radius:9px;padding:12px 14px;margin-bottom:8px}
.risk-item:last-child{margin-bottom:0}
.risk-item.high{background:var(--risk-high-bg);border-left:3px solid var(--risk-high)}
.risk-item.medium{background:var(--risk-med-bg);border-left:3px solid var(--risk-med)}
.risk-item.low{background:var(--risk-low-bg);border-left:3px solid var(--risk-low)}
.risk-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.risk-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.risk-item.high .risk-badge{background:var(--risk-high);color:#fff}
.risk-item.medium .risk-badge{background:var(--risk-med);color:#fff}
.risk-item.low .risk-badge{background:var(--risk-low);color:#fff}
.risk-clause{font-size:13px;font-weight:600}
.risk-excerpt{font-size:12px;font-style:italic;color:var(--txt2);margin:4px 0;border-left:2px solid currentColor;padding-left:8px;opacity:.85}
.risk-issue{font-size:12.5px;margin-bottom:3px}
.risk-sug{font-size:12px;color:var(--txt2)}
.risk-sug strong{color:var(--txt)}

.missing-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.missing-item:last-child{border-bottom:none;padding-bottom:0}
.mi-imp{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.mi-imp.high{background:var(--risk-high)}
.mi-imp.medium{background:var(--risk-med)}
.mi-clause{font-size:13px;font-weight:600;margin-bottom:2px}
.mi-desc{font-size:12px;color:var(--txt2)}

.comply-item{padding:9px 0;border-bottom:1px solid var(--border)}
.comply-item:last-child{border-bottom:none;padding-bottom:0}
.comply-article{font-size:11px;font-weight:700;color:var(--comply);margin-bottom:3px}
.comply-issue{font-size:13px;margin-bottom:2px}
.comply-sug{font-size:12px;color:var(--txt2)}

.strength-list{display:flex;flex-direction:column;gap:6px}
.strength-item{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.strength-item::before{content:"✓";color:var(--strength);font-weight:700;flex-shrink:0;margin-top:1px}

.truncated-warn{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:9px 14px;font-size:12px;color:#7a5c00;margin-bottom:12px}

.export-bar{display:flex;gap:10px;margin-bottom:16px}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#F5EFE3;padding:10px 20px;border-radius:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.22);opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}

@media(max-width:860px){
  .split{flex-direction:column}
  .pane-left{width:100%;min-width:0;height:auto;max-height:52%;border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/dashboard.html" class="hback">← Dashboard</a>
    <span>Hujjat tahlili <b>JuristAI</b></span>
  </div>
  <span style="font-size:12px;color:rgba(255,255,255,.5)">OCR + AI Analyzer</span>
</header>

<div class="split">
  <!-- ── Left pane: input ── -->
  <div class="pane pane-left">
    <div class="upload-section">
      <h2>Hujjatni yuklang</h2>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.webp" onchange="onFileSelect(this.files[0])">
        <div class="dz-icon">📄</div>
        <p><strong>Bosing yoki sudrab tashlang</strong><br>PDF, JPG, PNG, WebP · Maks 20 MB</p>
      </div>
      <div class="lang-row">
        <label>OCR tili:</label>
        <select id="langSelect">
          <option value="uzb+rus">O'zbek + Rus</option>
          <option value="rus">Faqat Rus</option>
          <option value="uzb">Faqat O'zbek</option>
          <option value="eng">English</option>
          <option value="uzb+rus+eng">Barchasi</option>
        </select>
      </div>
      <div class="ocr-progress" id="ocrProgress">
        <div class="ocr-label" id="ocrLabel">OCR ishlanmoqda…</div>
        <div class="ocr-bar-wrap"><div class="ocr-bar" id="ocrBar"></div></div>
      </div>
    </div>

    <div class="text-section">
      <label>Hujjat matni <span class="char-count" id="charCount">0 belgi</span></label>
      <textarea id="docText" placeholder="Hujjat matni avtomatik to'ldiriladi yoki bu yerga nusxalang…" oninput="updateCount()"></textarea>
    </div>

    <div class="action-bar">
      <button class="btn" onclick="clearAll()" title="Tozalash">✕</button>
      <button class="btn primary" id="analyzeBtn" onclick="analyze()">
        🔍 Tahlil qilish
      </button>
    </div>
  </div>

  <!-- ── Right pane: results ── -->
  <div class="pane pane-right" id="resultsPane">
    <div class="results-empty">
      <div class="icon">⚖️</div>
      <div style="font-weight:600;margin-bottom:6px">Tahlil natijasi bu yerda ko'rinadi</div>
      <div style="font-size:13px">Hujjat yuklang yoki matn kiriting, so'ng «Tahlil qilish» tugmasini bosing.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Tesseract.js v5 — client-side OCR, no server dependency -->
<script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script>
let lastAnalysis = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2800);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateCount(){
  const n = (document.getElementById('docText').value||'').length;
  document.getElementById('charCount').textContent = n.toLocaleString()+' belgi';
}

// ── Auth guard ──
(async()=>{
  const r = await fetch('/api/user-info',{credentials:'same-origin'});
  if(!r.ok) window.location.href='/login.html';
})();

// ── Drag & drop ──
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{ e.preventDefault(); dz.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) onFileSelect(f); });

async function onFileSelect(file){
  if(!file) return;
  const mb = (file.size/1024/1024).toFixed(1);
  if(file.size > 20*1024*1024){ toast('Fayl juda katta ('+mb+' MB). Maks 20 MB'); return; }
  dz.querySelector('p').innerHTML = `<strong>${esc(file.name)}</strong> (${mb} MB) yuklandi`;

  if(file.type === 'application/pdf' || file.name.match(/\.pdf$/i)){
    await extractPdf(file);
  } else {
    await ocrImage(file);
  }
}

// ── PDF extract (server-side) ──
async function extractPdf(file){
  const prog = document.getElementById('ocrProgress');
  const label = document.getElementById('ocrLabel');
  prog.style.display='block'; label.textContent='PDF o\'qilmoqda…';
  setBar(40);
  try{
    const form = new FormData(); form.append('file', file);
    const r = await fetch('/api/analyze/extract',{ method:'POST', credentials:'same-origin', body:form });
    if(r.status===401){ window.location.href='/login.html'; return; }
    const data = await r.json();
    if(data.error){ toast('PDF xatoligi: '+data.error); return; }
    if(data.scanned){
      toast('Skanerlangan PDF aniqlandi — sahifalarni rasm sifatida yuklang');
      label.textContent='Skanerlangan PDF — rasm yuklang';
      setBar(0);
      return;
    }
    document.getElementById('docText').value = data.text;
    updateCount();
    label.textContent='PDF o\'qildi ('+data.pageCount+' bet, '+data.charCount.toLocaleString()+' belgi)';
    setBar(100);
    setTimeout(()=>prog.style.display='none', 2000);
  }catch(e){ toast('PDF xatoligi: '+e.message); prog.style.display='none'; }
}

// ── Image OCR (client-side Tesseract.js) ──
async function ocrImage(file){
  const prog = document.getElementById('ocrProgress');
  const label = document.getElementById('ocrLabel');
  const lang = document.getElementById('langSelect').value;
  prog.style.display='block'; label.textContent='Tesseract yuklanmoqda…'; setBar(5);

  try{
    const result = await Tesseract.recognize(file, lang, {
      logger: m => {
        if(m.status === 'recognizing text'){
          const pct = Math.round((m.progress||0)*100);
          setBar(5 + pct*0.9);
          label.textContent = 'OCR: '+pct+'%';
        } else if(m.status === 'loading tesseract core' || m.status === 'loading language traineddata'){
          label.textContent = 'Til modeli yuklanmoqda…'; setBar(5);
        }
      }
    });
    const text = result.data.text || '';
    document.getElementById('docText').value = text;
    updateCount();
    setBar(100); label.textContent='OCR yakunlandi ('+text.length.toLocaleString()+' belgi)';
    setTimeout(()=>prog.style.display='none', 2000);
    if(text.trim().length < 50) toast('OCR kam matn topdi — rasm sifatini tekshiring');
  }catch(e){
    toast('OCR xatoligi: '+e.message);
    prog.style.display='none';
  }
}

function setBar(pct){ document.getElementById('ocrBar').style.width = pct+'%'; }

// ── Analyze ──
async function analyze(){
  const text = document.getElementById('docText').value.trim();
  if(text.length < 40){ toast('Tahlil uchun kamida 40 belgi kerak'); return; }
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Tahlil qilinmoqda…';

  // Derive langHint from selected OCR language
  const sel = document.getElementById('langSelect').value;
  const langHint = sel.startsWith('rus') ? 'ru' : sel.startsWith('uzb') ? 'uz' : null;

  try{
    const r = await fetch('/api/analyze',{
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({ text, langHint })
    });
    if(r.status===401){ window.location.href='/login.html'; return; }
    if(r.status===429){ toast('Kunlik limit tugadi'); return; }
    const data = await r.json();
    if(data.error){ toast('Tahlil xatoligi: '+data.error); return; }
    if(data.parseError){ renderRaw(data.raw); return; }
    lastAnalysis = data.analysis;
    renderResults(data.analysis, data.truncated);
  }catch(e){ toast('Xatolik: '+e.message); }
  finally{ btn.disabled=false; btn.innerHTML='🔍 Tahlil qilish'; }
}

// ── Render structured results ──
function renderResults(a, truncated){
  const rp = document.getElementById('resultsPane');
  const score = a.overallScore || 0;
  const scoreColor = score >= 75 ? '#1a7a4a' : score >= 50 ? '#c17a00' : '#b3261e';
  const circumference = 2 * Math.PI * 26; // r=26
  const dash = (score/100)*circumference;

  let html = '';

  if(truncated){
    html += `<div class="truncated-warn">⚠️ Hujjat juda uzun — birinchi 9 000 belgi tahlil qilindi. To'liq tahlil uchun hujjatni qisqartiring.</div>`;
  }

  // Score header
  html += `
<div class="score-header">
  <div class="score-ring">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="26" fill="none" stroke="#e4ddd4" stroke-width="6"/>
      <circle cx="32" cy="32" r="26" fill="none" stroke="${scoreColor}" stroke-width="6"
        stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}" stroke-linecap="round"/>
    </svg>
    <div class="score-num" style="color:${scoreColor}">${score}</div>
  </div>
  <div class="score-info">
    <div class="doc-type">${esc(a.docType||'Noma\'lum hujjat')}<span class="lang-badge">${esc(a.language||'')}</span></div>
    <div class="summary">${esc(a.summary||'')}</div>
  </div>
</div>`;

  // Export bar
  html += `
<div class="export-bar">
  <button class="btn" onclick="copyAnalysis()" style="font-size:12px">📋 Nusxalash</button>
  <button class="btn" onclick="downloadAnalysis()" style="font-size:12px">⬇ TXT yuklab olish</button>
</div>`;

  // Risk items
  const risks = a.riskItems || [];
  if(risks.length){
    const high = risks.filter(r=>r.level==='high').length;
    const badge = high ? `<span class="cnt" style="background:var(--risk-high);color:#fff">${high} yuqori xavf</span>` : `<span class="cnt" style="background:var(--risk-low-bg);color:var(--risk-low)">${risks.length} ta</span>`;
    html += `<div class="section-card"><h3>⚠️ Xavfli bandlar ${badge}</h3>`;
    html += risks.map(r=>`
<div class="risk-item ${esc(r.level||'low')}">
  <div class="risk-top">
    <span class="risk-badge">${r.level==='high'?'Yuqori xavf':r.level==='medium'?'O\'rta xavf':'Past xavf'}</span>
    <span class="risk-clause">${esc(r.clause||'')}</span>
  </div>
  ${r.excerpt?`<div class="risk-excerpt">"${esc(r.excerpt)}"</div>`:''}
  <div class="risk-issue">${esc(r.issue||'')}</div>
  ${r.suggestion?`<div class="risk-sug"><strong>Tavsiya:</strong> ${esc(r.suggestion)}</div>`:''}
</div>`).join('');
    html += `</div>`;
  }

  // Missing clauses
  const missing = a.missingClauses || [];
  if(missing.length){
    html += `<div class="section-card"><h3>📋 Yetishmayotgan bandlar <span class="cnt" style="background:var(--missing-bg);color:var(--missing)">${missing.length} ta</span></h3>`;
    html += `<div>` + missing.map(m=>`
<div class="missing-item">
  <div class="mi-imp ${esc(m.importance||'medium')}"></div>
  <div><div class="mi-clause">${esc(m.clause||'')}</div><div class="mi-desc">${esc(m.description||'')}</div></div>
</div>`).join('') + `</div></div>`;
  }

  // Compliance issues
  const comply = a.complianceIssues || [];
  if(comply.length){
    html += `<div class="section-card"><h3>⚖️ Qonun talablariga mos kelmaydigan joylar <span class="cnt" style="background:var(--comply-bg);color:var(--comply)">${comply.length} ta</span></h3>`;
    html += comply.map(c=>`
<div class="comply-item">
  ${c.article?`<div class="comply-article">${esc(c.article)}</div>`:''}
  <div class="comply-issue">${esc(c.issue||'')}</div>
  ${c.suggestion?`<div class="comply-sug">→ ${esc(c.suggestion)}</div>`:''}
</div>`).join('');
    html += `</div>`;
  }

  // Strengths
  const strengths = a.strengths || [];
  if(strengths.length){
    html += `<div class="section-card"><h3 style="color:var(--strength)">✅ Ijobiy tomonlar</h3><div class="strength-list">`;
    html += strengths.map(s=>`<div class="strength-item">${esc(s)}</div>`).join('');
    html += `</div></div>`;
  }

  if(!risks.length && !missing.length && !comply.length){
    html += `<div class="section-card" style="text-align:center;padding:24px;color:var(--txt2)">Tahlil tugadi — aniq muammolar aniqlanmadi.</div>`;
  }

  rp.innerHTML = html;
}

// ── Render raw (JSON parse failed) ──
function renderRaw(raw){
  document.getElementById('resultsPane').innerHTML = `
<div class="section-card">
  <h3>AI javobi (tuzilmagan)</h3>
  <p style="font-size:13px;white-space:pre-wrap;line-height:1.6">${esc(raw)}</p>
</div>`;
}

// ── Export ──
function analysisToText(){
  if(!lastAnalysis) return '';
  const a = lastAnalysis;
  let txt = `HUJJAT TAHLILI — JuristAI\n${'='.repeat(40)}\n`;
  txt += `Turi: ${a.docType||'—'}\nTil: ${a.language||'—'}\nUmumiy ball: ${a.overallScore||0}/100\n\n`;
  txt += `Xulosa:\n${a.summary||'—'}\n\n`;
  if(a.riskItems?.length){
    txt += `XAVFLI BANDLAR (${a.riskItems.length} ta)\n${'-'.repeat(30)}\n`;
    a.riskItems.forEach((r,i)=>{ txt += `${i+1}. [${(r.level||'').toUpperCase()}] ${r.clause||''}\n   ${r.issue||''}\n   Tavsiya: ${r.suggestion||''}\n\n`; });
  }
  if(a.missingClauses?.length){
    txt += `YETISHMAYOTGAN BANDLAR\n${'-'.repeat(30)}\n`;
    a.missingClauses.forEach((m,i)=>{ txt += `${i+1}. ${m.clause||''} — ${m.description||''}\n`; });
    txt += '\n';
  }
  if(a.complianceIssues?.length){
    txt += `QONUNGA MUVOFIQLIK\n${'-'.repeat(30)}\n`;
    a.complianceIssues.forEach((c,i)=>{ txt += `${i+1}. ${c.article||''}: ${c.issue||''}\n   → ${c.suggestion||''}\n`; });
    txt += '\n';
  }
  if(a.strengths?.length){ txt += `IJOBIY TOMONLAR\n${a.strengths.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n`; }
  return txt;
}

function copyAnalysis(){
  const txt = analysisToText();
  if(!txt){ toast('Tahlil qilinmagan'); return; }
  navigator.clipboard.writeText(txt).then(()=>toast('Nusxalandi')).catch(()=>toast('Nusxalab bo\'lmadi'));
}

function downloadAnalysis(){
  const txt = analysisToText();
  if(!txt){ toast('Tahlil qilinmagan'); return; }
  const blob = new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'juristai-tahlil-'+Date.now()+'.txt';
  document.body.appendChild(a); a.click(); a.remove();
}

function clearAll(){
  document.getElementById('docText').value='';
  document.getElementById('dropZone').querySelector('p').innerHTML = '<strong>Bosing yoki sudrab tashlang</strong><br>PDF, JPG, PNG, WebP · Maks 20 MB';
  updateCount(); lastAnalysis=null;
  document.getElementById('resultsPane').innerHTML = `<div class="results-empty"><div class="icon">⚖️</div><div style="font-weight:600;margin-bottom:6px">Tahlil natijasi bu yerda ko'rinadi</div><div style="font-size:13px">Hujjat yuklang yoki matn kiriting, so'ng «Tahlil qilish» tugmasini bosing.</div></div>`;
  document.getElementById('ocrProgress').style.display='none';
}
