<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.icons{display:grid;grid-template-columns:repeat(10,1fr);gap:14px}
.ic-cell{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-700)}
.ic-cell svg{width:22px;height:22px}
.ic-cell span{font:500 10px/1 var(--font-mono);color:var(--fg-3)}
</style></head><body><div class="card"><div class="type-eyebrow" style="margin-bottom:14px">Iconography — Lucide (CDN, 1.75 stroke)</div>
<div class="icons" id="g"></div>
<script>
const names=['scale','gavel','book-open','file-text','search','message-square','user','users','clock','check-circle-2','alert-triangle','sparkles','folder','paperclip','download','plus','settings','bell','log-out','briefcase'];
const g=document.getElementById('g');
names.forEach(n=>{
  const c=document.createElement('div');c.className='ic-cell';
  c.innerHTML=`<img src="https://unpkg.com/lucide-static@0.460.0/icons/${n}.svg" style="width:22px;height:22px;filter:brightness(0) saturate(100%) invert(15%) sepia(15%) saturate(900%) hue-rotate(15deg)" /><span>${n}</span>`;
  g.appendChild(c);
});
</script></div></body></html>
