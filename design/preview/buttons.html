<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font:600 14px/1 var(--font-sans);border:1px solid transparent;cursor:pointer;transition:all .15s ease}
.btn-primary{background:var(--ink-700);color:var(--parchment-50);border-color:var(--ink-700)}
.btn-primary:hover{background:var(--ink-900);border-color:var(--ink-900)}
.btn-brass{background:var(--brass-500);color:#fff;border-color:var(--brass-500)}
.btn-brass:hover{background:var(--brass-600)}
.btn-secondary{background:transparent;color:var(--ink-700);border-color:var(--ink-300)}
.btn-secondary:hover{background:var(--parchment-100);border-color:var(--ink-500)}
.btn-ghost{background:transparent;color:var(--ink-700);border-color:transparent}
.btn-ghost:hover{background:var(--parchment-100)}
.btn-danger{background:var(--burgundy-500);color:#fff;border-color:var(--burgundy-500)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
</style></head><body><div class="card"><div class="type-eyebrow" style="margin-bottom:14px">Buttons</div>
<div class="row" style="gap:10px">
<button class="btn btn-primary">Yangi hujjat</button>
<button class="btn btn-brass">Tasdiqlash</button>
<button class="btn btn-secondary">Bekor qilish</button>
<button class="btn btn-ghost">Saqlash</button>
<button class="btn btn-danger">O'chirish</button>
</div>
<div class="row" style="gap:10px;margin-top:14px">
<button class="btn btn-primary btn-sm">Small</button>
<button class="btn btn-secondary btn-sm">Small</button>
<button class="btn btn-ghost btn-sm">Small</button>
</div>
</div></body></html>
