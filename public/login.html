<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Dictum Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-block {
            display: inline-block;
            text-align: left;
        }
        .logo-row {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .logo h1 {
            color: #2c3e50;
            font-size: 36px;
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: 4px;
            margin: 0;
        }
        .logo-scales {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            color: #2c3e50;
        }
        .logo p {
            color: #7f8c8d;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            background: #667eea;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5568d3;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 42px;
        }
        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #999;
            font-size: 18px;
            line-height: 1;
            user-select: none;
            -webkit-user-select: none;
        }
        .eye-btn:hover {
            color: #667eea;
        }
        .eye-btn svg {
            width: 20px;
            height: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-block">
                <div class="logo-row">
                    <h1>DICTUM</h1>
                    <svg class="logo-scales" viewBox="0 0 80 96" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="40" cy="5" r="3.5"/>
                        <rect x="38" y="8" width="4" height="72" rx="1"/>
                        <rect x="5" y="14" width="70" height="3" rx="1.5"/>
                        <rect x="24" y="80" width="32" height="4" rx="2"/>
                        <line x1="9" y1="17" x2="1" y2="52" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                        <line x1="9" y1="17" x2="17" y2="52" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                        <path d="M0.5 52 C1 58 5 62 9 62 C13 62 17 58 17.5 52" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                        <line x1="71" y1="17" x2="63" y2="52" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                        <line x1="71" y1="17" x2="79" y2="52" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                        <path d="M62.5 52 C63 58 67 62 71 62 C75 62 79 58 79.5 52" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <p>Yuristlar yordamchi tizimi</p>
            </div>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Foydalanuvchi nomi</label>
                <input type="text" id="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required>
                    <button type="button" class="eye-btn" id="eyeBtn">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn">Kirish</button>
        </form>
    </div>
    <script>
        // Eye icon - show password on press & hold
        const eyeBtn = document.getElementById('eyeBtn');
        const passwordInput = document.getElementById('password');
        function showPassword() { passwordInput.type = 'text'; }
        function hidePassword() { passwordInput.type = 'password'; }
        eyeBtn.addEventListener('mousedown', showPassword);
        eyeBtn.addEventListener('mouseup', hidePassword);
        eyeBtn.addEventListener('mouseleave', hidePassword);
        eyeBtn.addEventListener('touchstart', function(e) { e.preventDefault(); showPassword(); });
        eyeBtn.addEventListener('touchend', hidePassword);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Kirish xato';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Xatolik: ' + error.message;
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
