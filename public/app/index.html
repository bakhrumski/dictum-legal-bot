<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JuristAI</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/app/fonts.css?v=3">
<link rel="stylesheet" href="/app/app.css?v=24">
<script>/* tema va yig'ilgan panel — sahifa chizilishidan oldin, "sakrash" bo'lmasin */try{document.documentElement.setAttribute('data-theme',localStorage.getItem('jai-theme')||'light');if(localStorage.getItem('jai-side')==='mini')document.documentElement.classList.add('side-mini')}catch(e){}</script>
</head>
<body class="booting">
<div class="app">
  <aside class="side" aria-label="JuristAI">
    <div class="brand"><a href="#/">JURISTAI</a><button class="ib" id="collapse" type="button" data-t-title="side.collapse" aria-expanded="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path class="chev" d="m15.5 10-2 2 2 2"/></svg></button></div>
    <button class="pill ghost new" id="newBtn" type="button" data-t-title="new"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-t="new"></span></button>
    <nav class="nav" id="nav" aria-label="Bo'limlar"></nav>
    <div class="side-sec"><span class="kicker" data-t="nav.history"></span><a href="#/suhbatlar" data-t="all"></a></div>
    <div class="hist" id="hist"></div>
    <div class="usage" id="usage"><div class="skel"></div></div>
    <button class="me" id="me" type="button" aria-haspopup="menu"><span class="av"></span><span><b></b><small></small></span></button>
  </aside>
  <section class="main">
    <header class="top">
      <button class="ib burger" id="burger" type="button" aria-label="Menyu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="title"></h1>
      <span class="sp"></span>
      <div class="seg" id="scope" role="group"><button type="button" data-s="personal" class="on" data-t="scope.personal"></button><button type="button" data-s="team" data-t="scope.team"></button></div>
    </header>
    <div class="view" id="view"></div>
  </section>
</div>
<script src="/js/uz-alphabet.js?v=1"></script>
<script src="/app/i18n.js?v=12"></script>
<script src="/app/core.js?v=11"></script>
<script src="/app/onboarding.js?v=3"></script>

</body>
</html>
