name: CI

# Runs on every pull request and on main. main deploys straight to
# production on Render, so this is the last check before a release.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check (src)
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core suite
        run: npm test
      - name: Workspace suite
        run: npm run test:workspace
      - name: Broad suite
        run: npm run test:all

  boot-smoke:
    name: Boot smoke (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Boot, anonymous-access matrix, SIGTERM
        run: scripts/ci/boot-smoke.sh
      - name: Quota races on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/tariff-race.db.test.js
      - name: Tariffs v2 periods, Sinov and reservations on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/tariffs-v2.db.test.js
      - name: Discount offers, price floor and margin report on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/tariff-offers.db.test.js
      - name: Cash, carried credit and service revenue (renewal, advance renewal, upgrade chain)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/tariff-revenue.db.test.js
      - name: Chat with a document - analysis, opinion and Workspace quotas on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/document-jobs.db.test.js
      - name: Test entitlement (pilot) and its AI budget on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/test-entitlement.db.test.js
      - name: Scanned documents - page count, ticket, held reservation and OCR cache on real Postgres (stub OCR)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/scan-ocr.db.test.js
      - name: Attaching a file never calls AI; services only when confirmed; explanation coverage (real routes, stub providers)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/upload-no-ai.db.test.js
      - name: Login and password on a Telegram account - step-up, sessions, master 2FA, test account on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/account-credentials.db.test.js
      - name: Safe re-ingest on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/rag-safe-reingest.db.test.js
      - name: Query indexes and margin report on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/db-indexes-margin.db.test.js
      - name: Auth flows and direct-message guard on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/auth-flows.test.js
      - name: One vote per account per answer on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/answer-votes.db.test.js
      - name: Keyword length normalisation on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/keyword-length-norm.db.test.js
      - name: Re-chunking oversized corpus rows on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/oversized-chunks.db.test.js
      - name: Exact-match failsafe uses word pairs on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/exact-match-phrases.db.test.js
      - name: Corpus script report and Latin re-ingest on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/corpus-audit.test.js
      - name: Suggested sources and batch ingest on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/source-suggestions.test.js
      - name: lex.uz status and corpus re-check on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/lex-status.test.js
      - name: Per-request AI usage ledger and report on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/usage-ledger.test.js
      - name: Telegram test account reservation and budget on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/telegram-test-account.test.js
      - name: Matters (ownership, Workspace roles, held scans) on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/matters.db.test.js
      - name: Agent runs (queue, lease takeover, checkpoints, cancel, settle) on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/agent-runs.db.test.js
      - name: Adaptive profile (codes only, pause, sweep, deletion) on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/adaptive-profile.db.test.js
      - name: CustDev pilot agents (codes, referrals, pilot approval, isolation) on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/sales-agents.db.test.js
      - name: Workspace for every paid plan + internal workspace (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/workspace-entitlement.db.test.js
      - name: Client type + one-tap pilot join (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/pilot-join.db.test.js
      - name: CustDev agent invite links (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/agent-invites.db.test.js
      - name: CustDev stage 3 - pilot tasks and feedback (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/pilot-feedback.db.test.js
      - name: CustDev stage 4 - interview recordings with consent (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/interviews.db.test.js
      - name: Document library + sealing at rest (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/document-library.db.test.js
      - name: Sealing at rest E2b (db)
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/sealing-e2b.db.test.js
      - name: Speech glossary per account (learn, isolation, cap) on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/voice-glossary.db.test.js
      - name: Planner agent (master gate, approval, price, worker) on real Postgres
        run: TEST_DATABASE_URL="$DATABASE_URL" PGSSL=disable node tests/agent-planner.db.test.js

  audit:
    name: npm audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Known findings are tracked in docs/audit/BACKLOG.md; this job reports
    # them on every PR without blocking until they are fixed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::High or critical advisories in production dependencies (see this log; tracked in docs/audit/BACKLOG.md)"
          fi
