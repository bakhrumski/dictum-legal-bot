<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.composer{width:560px;background:#fff;border:1px solid var(--border-2);border-radius:16px;padding:14px 16px;box-shadow:0 4px 16px rgba(26,20,16,.06)}
.composer:focus-within{border-color:var(--brass-300);box-shadow:0 0 0 3px rgba(176,132,66,.12),0 4px 16px rgba(26,20,16,.06)}
.input{font:400 15px/1.5 var(--font-sans);color:var(--fg-1);min-height:48px;outline:none}
.input:empty::before{content:'Qonun haqida savol bering yoki hujjat yuklang…';color:var(--fg-3)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-1)}
.tools{display:flex;gap:6px}
.tool{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fg-2);background:transparent;border:1px solid var(--border-1);cursor:pointer;font-size:14px}
.tool:hover{background:var(--parchment-100)}
.send{padding:7px 16px;border-radius:8px;background:var(--brass-500);color:#fff;font:600 13px/1 var(--font-sans);border:none;cursor:pointer}
</style></head><body><div class="card"><div class="type-eyebrow" style="margin-bottom:14px">Composer</div>
<div class="composer">
<div class="input" contenteditable="true">Mehnat shartnomasini muddatidan oldin bekor qilish bo'yicha qanday qoidalar bor?</div>
<div class="toolbar">
<div class="tools"><button class="tool">📎</button><button class="tool">📄</button><button class="tool">⚖</button></div>
<button class="send">Yuborish ↵</button>
</div></div></div></body></html>
