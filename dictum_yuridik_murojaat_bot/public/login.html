<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Dictum Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --login-bg: #f5f5f7;
            --login-card: rgba(255, 255, 255, 0.95);
            --login-card-border: rgba(0, 0, 0, 0.08);
            --login-text: #1d1d1f;
            --login-text-secondary: #6e6e73;
            --login-input-bg: rgba(245, 245, 247, 0.9);
            --login-input-border: rgba(0, 0, 0, 0.1);
            --login-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --login-bg: #0d1117;
            --login-card: rgba(22, 27, 34, 0.95);
            --login-card-border: rgba(255, 255, 255, 0.06);
            --login-text: #e6edf3;
            --login-text-secondary: #8b949e;
            --login-input-bg: rgba(255, 255, 255, 0.06);
            --login-input-border: rgba(255, 255, 255, 0.08);
            --login-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        *, *::before, *::after {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Inter', BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--login-bg);
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .login-container {
            background: var(--login-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--login-card-border);
            padding: 44px 36px;
            border-radius: 24px;
            box-shadow: var(--login-shadow);
            width: 100%;
            max-width: 400px;
            animation: loginSlideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes loginSlideUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .logo h1 {
            color: #7c5cbf;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .logo p {
            color: var(--login-text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: var(--login-text);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--login-input-border);
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            background: var(--login-input-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--login-text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus {
            outline: none;
            border-color: #2563a0;
            box-shadow: 0 0 0 4px rgba(37, 99, 160, 0.12);
            transform: scale(1.01);
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #1b3a5c, #2563a0);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 10px rgba(27, 58, 92, 0.25);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::after { opacity: 1; }
        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(27, 58, 92, 0.35);
        }
        .btn:active {
            transform: scale(0.96);
            transition-duration: 0.1s;
        }
        .error-message {
            background: rgba(248, 215, 218, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #721c24;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(231, 76, 60, 0.2);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        [data-theme="dark"] .error-message {
            background: rgba(80, 30, 30, 0.8);
            color: #f8a0a0;
            border-color: rgba(231, 76, 60, 0.3);
        }
        .error-message.show {
            display: block;
            animation: errorShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        /* Theme toggle — iOS circle */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--login-card-border);
            background: var(--login-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 0.2s, box-shadow 0.2s;
            animation: loginSlideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
            overflow: hidden;
        }
        .theme-toggle:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        }
        .theme-toggle:active { transform: scale(0.95); }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }
        .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
        .theme-toggle .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        [data-theme="dark"] .theme-toggle .icon-sun { opacity: 0; transform: rotate(90deg) scale(0.5); }
        [data-theme="dark"] .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Rejimni almashtirish">
        <span class="icon-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="#bdc3c7" stroke="none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="21" x2="12" y2="23" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="12" x2="3" y2="12" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="12" x2="23" y2="12" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="icon-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#bdc3c7" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg></span>
    </button>
    <script>
        (function() {
            const saved = localStorage.getItem('dictum-theme');
            if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            if (current === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('dictum-theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('dictum-theme', 'dark');
            }
        }
    </script>
    <div class="login-container">
        <div class="logo">
            <span class="logo-icon"><svg width="48" height="48" viewBox="0 0 64 64" fill="none" stroke="#bdc3c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="32" y1="8" x2="32" y2="56"/><line x1="12" y1="56" x2="52" y2="56"/><line x1="12" y1="18" x2="52" y2="18"/><circle cx="32" cy="8" r="3" fill="#bdc3c7" stroke="none"/><path d="M12 18 L6 38" /><path d="M12 18 L18 38" /><path d="M6 38 Q12 46 18 38" /><path d="M52 18 L46 38" /><path d="M52 18 L58 38" /><path d="M46 38 Q52 46 58 38" /></svg></span>
            <h1>DICTUM</h1>
            <p>Murojaatlar boshqaruv tizimi</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Foydalanuvchi nomi</label>
                <input type="text" id="username" placeholder="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" id="password" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn">Kirish</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Kirish xato';
                    errorDiv.classList.remove('show');
                    void errorDiv.offsetWidth;
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Xatolik: ' + error.message;
                errorDiv.classList.remove('show');
                void errorDiv.offsetWidth;
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
