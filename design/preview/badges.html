<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 11px/1.4 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;border:1px solid transparent}
.b-success{background:#DCEFE1;color:#2F6B43;border-color:#BFE0C8}
.b-warn{background:#FBEFD0;color:#8A5A0E;border-color:#EFD79A}
.b-danger{background:#F4DCDC;color:#8E2A2A;border-color:#E5BFBF}
.b-info{background:#DCE6F0;color:#2C4A6B;border-color:#BFCDDD}
.b-neutral{background:var(--parchment-100);color:var(--ink-700);border-color:var(--border-1)}
.b-brass{background:#F2E5C9;color:#6B4F1F;border-color:#E0CB97}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor}
</style></head><body><div class="card"><div class="type-eyebrow" style="margin-bottom:14px">Status Badges</div>
<div class="row" style="gap:8px">
<span class="badge b-success"><span class="dot"></span>Tasdiqlangan</span>
<span class="badge b-warn"><span class="dot"></span>Ko'rib chiqilmoqda</span>
<span class="badge b-danger"><span class="dot"></span>Xatolik</span>
<span class="badge b-info">Yangi</span>
<span class="badge b-neutral">Qoralama</span>
<span class="badge b-brass">AI Tahlil</span>
</div></div></body></html>
