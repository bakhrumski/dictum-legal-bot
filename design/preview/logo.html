<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.logo-row{display:flex;align-items:center;gap:48px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;background:var(--ink-900);color:var(--brass-300);display:flex;align-items:center;justify-content:center;border-radius:10px;font:700 22px/1 var(--font-serif)}
.mark.light{background:var(--parchment-50);color:var(--ink-900);border:1px solid var(--ink-300)}
.wm{font:700 22px/1 var(--font-serif);color:var(--ink-900);letter-spacing:-.01em;white-space:nowrap}
.wm em{color:var(--brass-500);font-style:normal;font-weight:700}
.tag{font:500 11px/1 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
</style></head><body><div class="card"><div class="type-eyebrow" style="margin-bottom:18px">Logo & Wordmark</div>
<div class="logo-row">
<div class="logo"><div class="mark">J</div><div><div class="wm">Jurist<em>AI</em></div><div class="tag">AI Yordamchi</div></div></div>
<div class="logo"><div class="mark light">J</div><div><div class="wm" style="font-size:18px">Jurist<em>AI</em></div></div></div>
<div class="logo"><div class="mark" style="width:32px;height:32px;font-size:16px">J</div></div>
</div>
<div style="margin-top:18px;font-size:12px;color:var(--fg-3)"><strong>Placeholder mark.</strong> Brass "AI" = the seal. Use brass on dark, ink on light.</div>
</div></body></html>
