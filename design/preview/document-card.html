<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.doc-card{width:300px;background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(26,20,16,.04);transition:all .2s ease;cursor:pointer}
.doc-card:hover{box-shadow:0 6px 18px rgba(26,20,16,.08);border-color:var(--brass-300);transform:translateY(-1px)}
.doc-icon{width:36px;height:44px;background:var(--parchment-100);border:1px solid var(--ink-300);border-radius:3px;position:relative;margin-bottom:14px}
.doc-icon::after{content:'';position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent #fff transparent transparent}
.doc-icon::before{content:'';position:absolute;top:14px;left:6px;right:6px;height:2px;background:var(--ink-300);box-shadow:0 6px 0 var(--ink-300),0 12px 0 var(--ink-300),0 18px 0 var(--ink-300)}
.doc-title{font:600 15px/1.3 var(--font-serif);color:var(--ink-900);margin-bottom:4px}
.doc-meta{font-size:12px;color:var(--fg-3);font-family:var(--font-mono)}
.doc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-1)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;font:600 10px/1.4 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;background:#DCEFE1;color:#2F6B43}
</style></head><body><div class="card"><div class="type-eyebrow" style="margin-bottom:14px">Document Card</div>
<div style="display:flex;gap:16px">
<div class="doc-card">
<div class="doc-icon"></div>
<div class="doc-title">Mehnat shartnomasi № 2024-481</div>
<div class="doc-meta">DOCX · 4 sahifa · 184 KB</div>
<div class="doc-foot"><span class="badge">Tasdiqlangan</span><span class="doc-meta">12 apr</span></div>
</div>
<div class="doc-card">
<div class="doc-icon"></div>
<div class="doc-title">Ijara shartnomasi (qoralama)</div>
<div class="doc-meta">DOCX · AI yaratdi</div>
<div class="doc-foot"><span class="badge" style="background:#FBEFD0;color:#8A5A0E">Qoralama</span><span class="doc-meta">15 apr</span></div>
</div>
</div></div></body></html>
