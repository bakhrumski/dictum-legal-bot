<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hujjat tuzish — JuristAI</title>
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
<link rel="stylesheet" href="/css/design-tokens.css">
<style>
  :root{
    --gold:#B08442; --gold-lt:#D6B379; --navy:#0E2236; --txt:#1A1410;
    --txt2:#5b5147; --card:#ffffff; --bg:#FBF8F2; --border:rgba(26,20,16,.12);
    --hl:#FBEFD2; --hl-active:#F4DC9E; --hl-border:#D6B379;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit;text-decoration:none}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:var(--navy);color:#F5EFE3;flex-shrink:0;box-shadow:0 1px 0 rgba(0,0,0,.2)}
  header .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
  header .brand b{font-family:'Source Serif 4',Georgia,serif;color:var(--gold-lt)}
  header .back{font-size:13px;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:8px;transition:.2s}
  header .back:hover{background:rgba(255,255,255,.1)}
  .tpl-picker{display:flex;align-items:center;gap:10px}
  .tpl-picker select{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#F5EFE3;font-size:13px;cursor:pointer;min-width:230px}
  .tpl-picker select option{color:#1A1410}
  .lang-toggle{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
  .lang-toggle button{background:transparent;color:rgba(255,255,255,.7);border:none;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .lang-toggle button.on{background:var(--gold);color:#1A1410}

  /* Split layout */
  .split{flex:1;display:flex;min-height:0}
  .pane{height:100%;overflow-y:auto}
  .pane-form{width:42%;min-width:340px;border-right:1px solid var(--border);background:var(--card)}
  .pane-preview{flex:1;background:#e9e4da;padding:28px;display:flex;flex-direction:column;align-items:center;gap:18px}

  /* Form */
  .form-inner{padding:22px 24px 60px}
  .form-head{margin-bottom:18px}
  .form-head h1{font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:600;color:var(--navy)}
  .form-head p{font-size:13px;color:var(--txt2);margin-top:4px;line-height:1.5}
  .field{margin-bottom:16px}
  .field label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--txt)}
  .field .req{color:#b3261e;margin-left:3px}
  .field input,.field textarea,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--txt);transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,132,66,.15)}
  .field textarea{min-height:84px;resize:vertical;line-height:1.5}
  .field .ai-btn{font-size:11.5px;font-weight:600;color:var(--gold);background:rgba(176,132,66,.1);border:1px solid rgba(176,132,66,.3);border-radius:6px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.15s}
  .field .ai-btn:hover{background:rgba(176,132,66,.2)}
  .field .ai-btn:disabled{opacity:.5;cursor:wait}

  /* Preview document */
  .doc-toolbar{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc-toolbar .hint{font-size:12px;color:var(--txt2)}
  .doc-actions{display:flex;gap:10px}
  .btn{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--txt);transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--gold)}
  .btn.primary{background:var(--navy);color:#F5EFE3;border-color:var(--navy)}
  .btn.primary:hover{background:#16365A}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .doc-page{width:100%;max-width:820px;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.14);border-radius:4px;padding:60px 64px;min-height:900px;font-family:'Times New Roman',Georgia,serif;font-size:14px;line-height:1.6;color:#111}
  .doc-page h1{font-size:14px;font-weight:normal}
  .doc-page h2{font-size:16px}
  .doc-page table{width:100%;border-collapse:collapse}
  .doc-page td{padding:0;border:none}
  /* Editable field highlight inside the document */
  .doc-page .fld{background:var(--hl);border-bottom:1px dashed var(--hl-border);padding:0 2px;border-radius:2px;cursor:pointer;transition:.15s}
  .doc-page .fld:hover{background:var(--hl-active)}
  .doc-page .fld.empty{color:#9a8f80;font-style:italic}
  .doc-page .fld.flash{background:var(--hl-active);box-shadow:0 0 0 2px var(--hl-border)}

  .empty-state{margin:auto;text-align:center;color:var(--txt2);font-size:14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#F5EFE3;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}

  @media(max-width:860px){
    .split{flex-direction:column}
    .pane-form{width:100%;min-width:0;height:auto;max-height:48%;border-right:none;border-bottom:1px solid var(--border)}
    .doc-page{padding:34px 26px}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="/dashboard.html" class="back">← Orqaga</a> <span>Hujjat tuzish <b>JuristAI</b></span></div>
  <div class="tpl-picker">
    <div class="lang-toggle" id="langToggle">
      <button data-lang="uz" class="on">UZ</button>
      <button data-lang="ru">RU</button>
    </div>
    <select id="tplSelect"><option value="">Shablonni tanlang…</option></select>
  </div>
</header>

<div class="split">
  <div class="pane pane-form">
    <div class="form-inner" id="formInner">
      <div class="empty-state">Yuqoridan hujjat shablonini tanlang.</div>
    </div>
  </div>
  <div class="pane pane-preview">
    <div class="doc-toolbar" id="docToolbar" style="display:none">
      <span class="hint">Hujjatdagi <b>sariq</b> joylarni bosib tahrirlang</span>
      <div class="doc-actions">
        <button class="btn" id="btnDocx" onclick="exportDoc('docx')">⬇ Word (.doc)</button>
        <button class="btn primary" id="btnPdf" onclick="exportDoc('pdf')">⬇ PDF</button>
      </div>
    </div>
    <div class="doc-page" id="docPage">
      <div class="empty-state">Hujjat shu yerda jonli ko'rinadi.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LANG = { current: 'uz' };
let TPL = null;          // current full template
const VALUES = {};       // field key -> value

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function L(obj){ return (obj && (obj[LANG.current] || obj.uz || obj.ru)) || ''; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Auth + load templates ──
async function init(){
  const u = await fetch('/api/user-info', {credentials:'same-origin'});
  if(!u.ok){ window.location.href='/login.html'; return; }
  const r = await fetch('/api/templates', {credentials:'same-origin'});
  if(!r.ok){ toast('Shablonlar yuklanmadi'); return; }
  const { templates } = await r.json();
  const sel = document.getElementById('tplSelect');
  templates.forEach(t=>{
    const o = document.createElement('option');
    o.value = t.id; o.textContent = L(t.name);
    o.dataset.name = JSON.stringify(t.name);
    sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ if(sel.value) loadTemplate(sel.value); });
}

// ── Language toggle ──
document.getElementById('langToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button'); if(!btn) return;
  LANG.current = btn.dataset.lang;
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on', b===btn));
  // relabel template options
  document.querySelectorAll('#tplSelect option').forEach(o=>{
    if(o.dataset.name) o.textContent = L(JSON.parse(o.dataset.name));
  });
  if(TPL) renderForm();
});

// ── Load a template ──
async function loadTemplate(id){
  const r = await fetch('/api/templates/'+encodeURIComponent(id), {credentials:'same-origin'});
  if(!r.ok){ toast('Shablon topilmadi'); return; }
  TPL = await r.json();
  // reset values, prefill today's date for date fields
  Object.keys(VALUES).forEach(k=>delete VALUES[k]);
  const today = new Date().toISOString().slice(0,10);
  TPL.fields.forEach(f=>{ if(f.type==='date') VALUES[f.key]=today; if(f.type==='select'&&f.options&&f.options[0]) VALUES[f.key]=f.options[0].value; });
  document.getElementById('docToolbar').style.display='flex';
  renderForm();
  renderDoc();
}

// ── Render the left form ──
function renderForm(){
  const c = document.getElementById('formInner');
  let h = '<div class="form-head"><h1>'+esc(L(TPL.name))+'</h1><p>'+esc(L(TPL.description))+'</p></div>';
  TPL.fields.forEach(f=>{
    const val = VALUES[f.key]!=null ? VALUES[f.key] : '';
    const ai = f.aiHint ? '<button class="ai-btn" onclick="aiSuggest(\''+f.key+'\',this)">✨ AI tavsiya</button>' : '';
    h += '<div class="field" id="field-'+f.key+'">';
    h += '<label><span>'+esc(L(f.label))+(f.required?'<span class="req">*</span>':'')+'</span>'+ai+'</label>';
    if(f.type==='textarea'){
      h += '<textarea data-k="'+f.key+'" placeholder="'+esc(L(f.placeholder))+'">'+esc(val)+'</textarea>';
    } else if(f.type==='select'){
      h += '<select data-k="'+f.key+'">'+ (f.options||[]).map(o=>'<option value="'+esc(o.value)+'"'+(o.value===val?' selected':'')+'>'+esc(L(o.label))+'</option>').join('') +'</select>';
    } else {
      const itype = f.type==='date'?'date':(f.type==='number'?'number':'text');
      h += '<input type="'+itype+'" data-k="'+f.key+'" value="'+esc(val)+'" placeholder="'+esc(L(f.placeholder))+'">';
    }
    h += '</div>';
  });
  c.innerHTML = h;
  c.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('input', ()=>{ VALUES[el.dataset.k]=el.value; renderDoc(); });
  });
}

// ── Render the live document preview ──
function renderDoc(){
  const page = document.getElementById('docPage');
  let html = TPL.body.replace(/\{\{(\w+)\}\}/g, (_, key)=>{
    const f = TPL.fields.find(x=>x.key===key);
    const raw = VALUES[key];
    const empty = raw==null || String(raw).trim()==='';
    const label = f ? L(f.label) : key;
    const shown = empty ? esc(label) : esc(raw).replace(/\n/g,'<br>');
    return '<span class="fld'+(empty?' empty':'')+'" data-k="'+key+'" title="Tahrirlash: '+esc(label)+'">'+shown+'</span>';
  });
  page.innerHTML = html;
  page.querySelectorAll('.fld').forEach(span=>{
    span.addEventListener('click', ()=>{
      const fld = document.getElementById('field-'+span.dataset.k);
      if(fld){ const inp = fld.querySelector('[data-k]'); fld.scrollIntoView({behavior:'smooth',block:'center'}); if(inp) inp.focus(); }
    });
  });
}

// ── AI suggestion for a field ──
async function aiSuggest(key, btn){
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '⏳ …';
  try{
    const r = await fetch('/api/draft/suggest', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({ templateId: TPL.id, fieldKey: key, values: VALUES })
    });
    if(r.status===429){ toast('Kunlik limit tugadi'); return; }
    if(!r.ok){ toast('AI tavsiya xatoligi'); return; }
    const { value } = await r.json();
    VALUES[key] = value;
    const el = document.querySelector('[data-k="'+key+'"]');
    // update the form control (could be textarea/input)
    const fieldEl = document.querySelector('#field-'+key+' [data-k]');
    if(fieldEl) fieldEl.value = value;
    renderDoc();
    const span = document.querySelector('.doc-page .fld[data-k="'+key+'"]');
    if(span){ span.classList.add('flash'); setTimeout(()=>span.classList.remove('flash'),1200); }
    toast('AI tavsiya qo\'shildi');
  }catch(e){ toast('Xatolik: '+e.message); }
  finally{ btn.disabled=false; btn.textContent=orig; }
}

// ── Export ──
async function exportDoc(format){
  if(!TPL) return;
  const missing = TPL.fields.filter(f=>f.required && (!VALUES[f.key]||!String(VALUES[f.key]).trim()));
  if(missing.length){
    if(!confirm('Ba\'zi majburiy maydonlar bo\'sh ('+missing.length+' ta). Baribir yuklab olasizmi?')) return;
  }
  const btn = format==='pdf'?document.getElementById('btnPdf'):document.getElementById('btnDocx');
  btn.disabled = true; const orig = btn.textContent; btn.textContent='⏳ …';
  try{
    const r = await fetch('/api/draft/export', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({ templateId: TPL.id, values: VALUES, format })
    });
    if(r.status===429){ toast('Kunlik limit tugadi'); return; }
    const ct = r.headers.get('Content-Type')||'';
    if(ct.includes('application/json')){
      // client-print fallback for PDF
      const data = await r.json();
      if(data.mode==='client-print'){ printHtml(data.html); return; }
      toast(data.error||'Eksport xatoligi'); return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = TPL.id + (format==='pdf'?'.pdf':'.doc');
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Yuklab olindi');
  }catch(e){ toast('Xatolik: '+e.message); }
  finally{ btn.disabled=false; btn.textContent=orig; }
}

// Fallback PDF: open print dialog with the document HTML
function printHtml(html){
  const w = window.open('', '_blank');
  if(!w){ toast('Pop-up bloklandi — ruxsat bering'); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(()=>{ w.print(); }, 400);
}

init();
</script>
</body>
</html>
