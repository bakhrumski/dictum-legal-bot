<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictum - Murojaatlar Dashboard</title>
    <!-- PDF & Chart Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        @font-face {
            font-family: 'Roboto';
            src: url('/fonts/Roboto-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Roboto';
            src: url('/fonts/Roboto-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .header-right {
            text-align: right;
        }
        
        .user-info {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .role-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .role-master {
            background: #3498db;
            color: white;
        }
        
        .role-student {
            background: #9b59b6;
            color: white;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .pending { color: #f39c12; }
        .student-responded { color: #9b59b6; }
        .answered { color: #27ae60; }
        .rejected { color: #e74c3c; }
        
        .requests-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .controls {
            margin-bottom: 20px;
        }
        
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .filter-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-section select {
            min-width: 180px;
        }
        
        select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 14px;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .request-item {
            border: 1px solid #ecf0f1;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .request-item:hover {
            background: #f8f9fa;
            border-color: #3498db;
        }
        
        .request-item.needs-approval {
            border-left: 4px solid #9b59b6;
            background: #f8f4ff;
        }
        
        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .client-name {
            font-weight: bold;
            font-size: 18px;
            color: #2c3e50;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-student_responded {
            background: #e8daef;
            color: #5b2c6f;
        }
        
        .status-answered {
            background: #d4edda;
            color: #155724;
        }
        
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .request-preview {
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        .request-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #95a5a6;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .modal-content {
            position: relative;
            background: white;
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #7f8c8d;
        }
        
        .close-btn:hover {
            color: #2c3e50;
        }
        
        .detail-section {
            margin-bottom: 20px;
        }
        
        .detail-section h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        
        .detail-row {
            display: flex;
            margin-bottom: 8px;
        }
        
        .detail-label {
            font-weight: bold;
            color: #7f8c8d;
            width: 150px;
        }
        
        .detail-value {
            color: #2c3e50;
        }
        
        .request-text-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #3498db;
            margin-top: 10px;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn {
            background: #3498db;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 10px;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn-success {
            background: #27ae60;
        }
        
        .btn-success:hover {
            background: #229954;
        }
        
        .btn-danger {
            background: #e74c3c;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .response-box {
            background: #d4edda;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #28a745;
            margin-top: 10px;
        }
        
        .student-response-box {
            background: #e8daef;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #9b59b6;
            margin-top: 10px;
        }
        
        .approval-section {
            background: #fff3cd;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #f39c12;
        }
        
        .approval-section h4 {
            color: #856404;
            margin-bottom: 15px;
        }
        
        .file-attachment {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #3498db;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .file-icon {
            font-size: 32px;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 12px;
        }
        
        .file-preview {
            margin-top: 10px;
        }
        
        .file-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 5px;
        }
        
        .file-preview audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .file-preview video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 5px;
        }
        
        .admin-actions {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #f39c12;
        }
        
        .admin-actions h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .block-info {
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            color: #721c24;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        
        .empty-state h2 {
            margin-bottom: 10px;
            color: #95a5a6;
        }

        /* User Folder Styles */
        .user-folder {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }

        .user-folder:hover {
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .user-folder-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .user-folder-header:hover {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
        }

        .user-folder-header.has-unanswered {
            border-left: 4px solid #e74c3c;
        }

        .user-folder-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .folder-toggle {
            font-size: 14px;
            color: #7f8c8d;
            transition: transform 0.3s;
            width: 20px;
            text-align: center;
        }

        .folder-toggle.open {
            transform: rotate(90deg);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .user-avatar.blocked {
            background: #e74c3c;
        }

        .user-folder-info h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .user-folder-info .user-meta {
            font-size: 13px;
            color: #7f8c8d;
        }

        .user-folder-badges {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .folder-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-total {
            background: #eaf2f8;
            color: #2980b9;
        }

        .badge-unanswered {
            background: #e74c3c;
            color: white;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .badge-answered {
            background: #d4edda;
            color: #155724;
        }

        .badge-blocked {
            background: #f8d7da;
            color: #721c24;
        }

        .user-folder-content {
            display: none;
            padding: 0;
        }

        .user-folder-content.open {
            display: block;
        }

        /* Date Group Styles */
        .date-group {
            border-top: 1px solid #ecf0f1;
        }

        .date-group-header {
            padding: 10px 20px;
            background: #fafbfc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .date-group-header:hover {
            background: #f0f2f5;
        }

        .date-group-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #546e7a;
        }

        .date-group-left .date-icon {
            font-size: 16px;
        }

        .date-group-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-badge-unanswered {
            background: #e74c3c;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .date-badge-count {
            background: #ecf0f1;
            color: #7f8c8d;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .date-group-content {
            display: none;
        }

        .date-group-content.open {
            display: block;
        }

        .date-group-content .request-item {
            margin: 0;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-top: none;
            border-bottom: 1px solid #f0f0f0;
            padding: 12px 20px 12px 40px;
        }

        .date-group-content .request-item:last-child {
            border-bottom: none;
        }

        .date-group-content .request-item:hover {
            background: #f0f7ff;
        }

        .date-group-content .request-item .client-name {
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>🏛️ Dictum Advokatlik Firmasi</h1>
                <p class="subtitle">Murojaatlar boshqaruv tizimi</p>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <span id="userName"></span>
                    <span id="userRole" class="role-badge"></span>
                </div>
                <button class="logout-btn" onclick="logout()">Chiqish</button>
            </div>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Jami Murojaatlar</h3>
                <div class="number" id="totalRequests">0</div>
            </div>
            <div class="stat-card">
                <h3>Kutilmoqda</h3>
                <div class="number pending" id="pendingRequests">0</div>
            </div>
            <div class="stat-card">
                <h3>Student javobi</h3>
                <div class="number student-responded" id="studentResponded">0</div>
            </div>
            <div class="stat-card">
                <h3>Javob Berilgan</h3>
                <div class="number answered" id="answeredRequests">0</div>
            </div>
        </div>
        
        <div class="requests-container">
            <div class="controls">
                <div class="controls-header">
                    <h2>Murojaatlar ro'yxati</h2>
                    <button class="btn btn-success" onclick="exportToPDF()">
                        📊 PDF hisobot yuklash
                    </button>
                </div>
                <div class="filter-section">
                    <select id="categoryFilter" onchange="filterRequests()">
                        <option value="">Barcha yo'nalishlar</option>
                        <option value="Fuqarolik huquqi">Fuqarolik huquqi</option>
                        <option value="Jinoyat huquqi">Jinoyat huquqi</option>
                        <option value="Mehnat huquqi">Mehnat huquqi</option>
                        <option value="Oila huquqi">Oila huquqi</option>
                        <option value="Biznes/Korporativ huquq">Biznes/Korporativ huquq</option>
                        <option value="Ko'chmas mulk">Ko'chmas mulk</option>
                        <option value="Soliq huquqi">Soliq huquqi</option>
                        <option value="Ma'muriy huquq">Ma'muriy huquq</option>
                        <option value="Boshqa">Boshqa</option>
                    </select>
                    
                    <select id="assigneeFilter" onchange="filterRequests()">
                        <option value="">Barcha javob beruvchilar</option>
                        <option value="Master Admin">Master Admin</option>
                        <option value="Student Admin 1">Student Admin 1</option>
                    </select>
                    
                    <select id="statusFilter" onchange="filterRequests()">
                        <option value="">Barcha statuslar</option>
                        <option value="pending">Kutilmoqda</option>
                        <option value="student_responded">Student javobi</option>
                        <option value="answered">Javob berilgan</option>
                        <option value="rejected">Rad etilgan</option>
                    </select>
                    
                    <select id="assignedFilter" onchange="filterRequests()">
                        <option value="">Barcha tayinlovlar</option>
                        <option value="unassigned">Tayinlanmagan</option>
                        <option value="assigned">Tayinlangan</option>
                    </select>
                    
                    <button class="btn" onclick="clearFilters()" style="background: #95a5a6; padding: 8px 15px;">
                        ↺ Tozalash
                    </button>
                </div>
            </div>
            <div id="requestsList">
                <div class="loading">Yuklanmoqda...</div>
            </div>
        </div>
    </div>
    
    <!-- Hidden chart canvases for PDF export (high-res) -->
    <div id="chartContainer" style="position: absolute; left: -9999px; top: -9999px;">
        <canvas id="statusChart" width="900" height="600"></canvas>
        <canvas id="categoryChart" width="900" height="600"></canvas>
        <canvas id="monthlyChart" width="1200" height="500"></canvas>
        <canvas id="typeChart" width="900" height="600"></canvas>
    </div>

    <div id="requestModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>
    
    <script>
        let requests = [];
        let currentUser = {};
        let allAdmins = [];
        let openFolders = new Set();
        let openDateGroups = new Set();
        let currentFilters = {
            category: '',
            assignee: '',
            status: 'pending',
            assigned: ''
        };
        
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user-info');
                const data = await response.json();
                currentUser = data;
                
                document.getElementById('userName').textContent = data.fullName || data.username;
                const roleBadge = document.getElementById('userRole');
                roleBadge.textContent = data.role === 'master' ? 'Master Admin' : 'Student Admin';
                roleBadge.className = 'role-badge role-' + data.role;
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }
        
        async function loadAdmins() {
            try {
                const response = await fetch('/api/admins');
                allAdmins = await response.json();
            } catch (error) {
                console.error('Error loading admins:', error);
            }
        }
        
        async function loadRequests() {
            try {
                const response = await fetch('/api/requests');
                requests = await response.json();
                
                displayRequests(
                    currentFilters.category,
                    currentFilters.assignee,
                    currentFilters.status,
                    currentFilters.assigned
                );
                updateStats();
            } catch (error) {
                console.error('Error loading requests:', error);
                document.getElementById('requestsList').innerHTML = 
                    '<div class="empty-state"><h2>Xatolik yuz berdi</h2><p>Serverga ulanib bo\'lmadi</p></div>';
            }
        }
        
        function filterRequests() {
            currentFilters.category = document.getElementById('categoryFilter').value;
            currentFilters.assignee = document.getElementById('assigneeFilter').value;
            currentFilters.status = document.getElementById('statusFilter').value;
            currentFilters.assigned = document.getElementById('assignedFilter').value;
            
            displayRequests(
                currentFilters.category,
                currentFilters.assignee,
                currentFilters.status,
                currentFilters.assigned
            );
        }
        
        function clearFilters() {
            document.getElementById('categoryFilter').value = '';
            document.getElementById('assigneeFilter').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('assignedFilter').value = '';
            
            currentFilters = {
                category: '',
                assignee: '',
                status: '',
                assigned: ''
            };
            
            displayRequests();
        }
        
        function isUnanswered(req) {
            return req.status === 'pending' || req.status === 'rejected' || req.status === 'student_responded';
        }

        function getDatePeriod(dateStr) {
            const now = new Date();
            const date = new Date(dateStr);
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterdayStart = new Date(todayStart);
            yesterdayStart.setDate(yesterdayStart.getDate() - 1);

            const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
            const weekStart = new Date(todayStart);
            weekStart.setDate(weekStart.getDate() - dayOfWeek + 1);

            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            if (date >= todayStart) return 'today';
            if (date >= yesterdayStart) return 'yesterday';
            if (date >= weekStart) return 'this_week';
            if (date >= monthStart) return 'this_month';
            return 'older';
        }

        const datePeriodLabels = {
            'today': { label: 'Bugun', icon: '📅' },
            'yesterday': { label: 'Kecha', icon: '📆' },
            'this_week': { label: 'Shu hafta', icon: '🗓️' },

            'older': { label: 'Oldingi', icon: '📦' }
        };

        const datePeriodOrder = ['today', 'yesterday', 'this_week', 'this_month', 'older'];

        function displayRequests(filterCategory = '', filterAssignee = '', filterStatus = '', filterAssigned = '') {
            const container = document.getElementById('requestsList');

            let filteredRequests = requests;

            if (filterCategory) {
                filteredRequests = filteredRequests.filter(r => r.category === filterCategory);
            }
            if (filterAssignee) {
                filteredRequests = filteredRequests.filter(r => r.responded_by === filterAssignee);
            }
            if (filterStatus) {
                filteredRequests = filteredRequests.filter(r => r.status === filterStatus);
            }
            if (filterAssigned === 'unassigned') {
                filteredRequests = filteredRequests.filter(r => !r.assigned_to);
            } else if (filterAssigned === 'assigned') {
                filteredRequests = filteredRequests.filter(r => r.assigned_to);
            }

            if (filteredRequests.length === 0) {
                container.innerHTML =
                    '<div class="empty-state"><h2>Hech qanday murojaat topilmadi</h2></div>';
                return;
            }

            // Group by user (telegram_id)
            const userGroups = {};
            filteredRequests.forEach(req => {
                const key = req.telegram_id;
                if (!userGroups[key]) {
                    userGroups[key] = {
                        telegram_id: req.telegram_id,
                        username: req.username,
                        first_name: req.first_name || req.name || 'N/A',
                        blocked: req.blocked,
                        requests: []
                    };
                }
                userGroups[key].requests.push(req);
            });

            // Sort users: those with unanswered requests first, then by most recent request
            const sortedUsers = Object.values(userGroups).sort((a, b) => {
                const aUnanswered = a.requests.filter(isUnanswered).length;
                const bUnanswered = b.requests.filter(isUnanswered).length;
                if (aUnanswered > 0 && bUnanswered === 0) return -1;
                if (bUnanswered > 0 && aUnanswered === 0) return 1;
                const aLatest = new Date(a.requests[0].created_at);
                const bLatest = new Date(b.requests[0].created_at);
                return bLatest - aLatest;
            });

            const statusText = {
                'pending': 'Kutilmoqda',
                'student_responded': 'Student javobi',
                'answered': 'Javob berilgan',
                'rejected': 'Rad etilgan'
            };

            let html = '';

            sortedUsers.forEach((user) => {
                const totalReqs = user.requests.length;
                const unansweredCount = user.requests.filter(isUnanswered).length;
                const answeredCount = user.requests.filter(r => r.status === 'answered').length;
                const initial = (user.first_name || '?')[0].toUpperCase();
                const folderId = `folder_${user.telegram_id}`;
                const isFolderOpen = openFolders.has(folderId);

                // Group requests by date period
                const dateGroups = {};
                user.requests.forEach(req => {
                    const period = getDatePeriod(req.created_at);
                    if (!dateGroups[period]) dateGroups[period] = [];
                    dateGroups[period].push(req);
                });

                html += `
                <div class="user-folder">
                    <div class="user-folder-header ${unansweredCount > 0 ? 'has-unanswered' : ''}" onclick="toggleFolder('${folderId}')">
                        <div class="user-folder-left">
                            <span class="folder-toggle ${isFolderOpen ? 'open' : ''}" id="toggle_${folderId}">▶</span>
                            <div class="user-avatar ${user.blocked ? 'blocked' : ''}">${user.blocked ? '🚫' : initial}</div>
                            <div class="user-folder-info">
                                <h3>${user.first_name} ${user.blocked ? '<span style="color:#e74c3c;font-size:12px;">BLOKLANGAN</span>' : ''}</h3>
                                <div class="user-meta">@${user.username || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="user-folder-badges">
                            ${unansweredCount > 0 ? `<span class="folder-badge badge-unanswered">+${unansweredCount} javobsiz</span>` : ''}
                            <span class="folder-badge badge-answered">${answeredCount} javob</span>
                            <span class="folder-badge badge-total">${totalReqs} jami</span>
                        </div>
                    </div>
                    <div class="user-folder-content ${isFolderOpen ? 'open' : ''}" id="${folderId}">
                `;

                // Render date groups in order
                datePeriodOrder.forEach(period => {
                    if (!dateGroups[period]) return;
                    const periodReqs = dateGroups[period];
                    const periodUnanswered = periodReqs.filter(isUnanswered).length;
                    const periodInfo = datePeriodLabels[period];
                    const dateGroupId = `dg_${user.telegram_id}_${period}`;

                    const isDateGroupOpen = openDateGroups.has(dateGroupId);
                    html += `
                    <div class="date-group">
                        <div class="date-group-header" onclick="event.stopPropagation(); toggleDateGroup('${dateGroupId}')">
                            <div class="date-group-left">
                                <span class="date-icon">${periodInfo.icon}</span>
                                ${periodInfo.label}
                            </div>
                            <div class="date-group-badges">
                                ${periodUnanswered > 0 ? `<span class="date-badge-unanswered">+${periodUnanswered}</span>` : ''}
                                <span class="date-badge-count">${periodReqs.length} ta</span>
                            </div>
                        </div>
                        <div class="date-group-content ${isDateGroupOpen ? 'open' : ''}" id="${dateGroupId}">
                    `;

                    periodReqs.forEach(req => {
                        const needsApproval = req.status === 'student_responded' && currentUser.role === 'master';
                        html += `
                        <div class="request-item ${needsApproval ? 'needs-approval' : ''}" onclick="event.stopPropagation(); showRequestDetail(${req.id})">
                            <div class="request-header">
                                <div class="client-name">
                                    ${req.request_text.substring(0, 80)}${req.request_text.length > 80 ? '...' : ''}
                                </div>
                                <span class="status-badge status-${req.status}">
                                    ${statusText[req.status] || req.status}
                                </span>
                            </div>
                            <div class="request-meta">
                                ${req.file_id ? `<span>${getFileIcon(req.request_type)} ${req.request_type}</span>` : ''}
                                <span>📂 ${req.category || 'N/A'}</span>
                                ${req.assigned_lawyer_name ? `<span>👤 ${req.assigned_lawyer_name}</span>` : '<span style="color: #e67e22;">⚠️ Tayinlanmagan</span>'}
                                <span>🕐 ${new Date(req.created_at).toLocaleString('uz-UZ')}</span>
                                ${req.responded_by ? `<span>✍️ ${req.responded_by}</span>` : ''}
                            </div>
                        </div>
                        `;
                    });

                    html += `
                        </div>
                    </div>
                    `;
                });

                html += `
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleFolder(folderId) {
            const content = document.getElementById(folderId);
            const toggle = document.getElementById('toggle_' + folderId);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                toggle.classList.remove('open');
                openFolders.delete(folderId);
            } else {
                content.classList.add('open');
                toggle.classList.add('open');
                openFolders.add(folderId);
            }
        }

        function toggleDateGroup(groupId) {
            const content = document.getElementById(groupId);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                openDateGroups.delete(groupId);
            } else {
                content.classList.add('open');
                openDateGroups.add(groupId);
            }
        }
        
        function updateStats() {
            const total = requests.length;
            const pending = requests.filter(r => r.status === 'pending' || r.status === 'rejected').length;
            const studentResponded = requests.filter(r => r.status === 'student_responded').length;
            const answered = requests.filter(r => r.status === 'answered').length;
            
            document.getElementById('totalRequests').textContent = total;
            document.getElementById('pendingRequests').textContent = pending;
            document.getElementById('studentResponded').textContent = studentResponded;
            document.getElementById('answeredRequests').textContent = answered;
        }
        
        function getFileIcon(type) {
            const icons = {
                'voice': '🎤',
                'video': '🎥',
                'video_note': '🎬',
                'photo': '🖼️',
                'document': '📄',
                'audio': '🎵'
            };
            return icons[type] || '📎';
        }
        
        function formatFileSize(bytes) {
            if (!bytes) return 'N/A';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

                const data = await response.json();
                
                const playerDiv = document.getElementById(`audioPlayer_${requestId}`);
                playerDiv.innerHTML = `

                        <source src="${data.fileLink}" type="audio/ogg">
                        Brauzeringiz audio fayllarni qo'llab-quvvatlamaydi.
                    </audio>
                `;
            } catch (error) {
                console.error('Error playing audio:', error);
                alert('Ovozli xabarni yuklab bo\'lmadi');

        }

        async function updateCategory(requestId, category) {
            try {
                const response = await fetch('/api/update-category', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requestId, category })
                });

                if (response.ok) {
                    // Update local data
                    const req = requests.find(r => r.id === requestId);
                    if (req) req.category = category;

                    // Update dropdown styling
                    const select = document.getElementById('categorySelect');
                    if (select) {
                        const isDefault = category === 'Boshqa';
                        select.style.border = `1px solid ${isDefault ? '#e74c3c' : '#27ae60'}`;
                        select.style.background = isDefault ? '#fff5f5' : '#f0fff0';
                        const hint = select.nextElementSibling;
                        if (hint) {
                            hint.innerHTML = isDefault
                                ? '⚠️ Javob berishdan oldin tanlang!'
                                : '✅';
                            hint.style.color = isDefault ? '#e74c3c' : '#27ae60';
                        }
                    }

                    // Refresh the list behind the modal
                    displayRequests(
                        currentFilters.category,
                        currentFilters.assignee,
                        currentFilters.status,
                        currentFilters.assigned
                    );
                }
            } catch (error) {
                console.error('Error updating category:', error);
            }
        }

        // ========== 3D CHART PLUGINS ==========
        const shadow3DPlugin = {
            id: 'shadow3d',
            beforeDraw: (chart) => {
                const ctx = chart.ctx;
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;
            },
            afterDraw: (chart) => {
                chart.ctx.restore();
            }
        };

        const doughnut3DPlugin = {
            id: 'doughnut3d',
            beforeDraw: (chart) => {
                if (chart.config.type !== 'doughnut' && chart.config.type !== 'pie') return;
                const ctx = chart.ctx;
                const meta = chart.getDatasetMeta(0);
                if (!meta || !meta.data || meta.data.length === 0) return;
                const depth = 6;
                ctx.save();
                for (let layer = depth; layer > 0; layer--) {
                    meta.data.forEach((arc, i) => {
                        const bgColor = chart.data.datasets[0].backgroundColor[i];
                        ctx.beginPath();
                        ctx.arc(arc.x, arc.y + layer, arc.outerRadius, arc.startAngle, arc.endAngle);
                        if (chart.config.type === 'doughnut') {
                            ctx.arc(arc.x, arc.y + layer, arc.innerRadius, arc.endAngle, arc.startAngle, true);
                        } else {
                            ctx.lineTo(arc.x, arc.y + layer);
                        }
                        ctx.closePath();
                        ctx.fillStyle = darkenColor(bgColor, 0.35);
                        ctx.fill();
                    });
                }
                ctx.restore();
            }
        };

        function darkenColor(hex, amount) {
            hex = hex.replace('#', '');
            const r = Math.max(0, Math.floor(parseInt(hex.substring(0, 2), 16) * (1 - amount)));
            const g = Math.max(0, Math.floor(parseInt(hex.substring(2, 4), 16) * (1 - amount)));
            const b = Math.max(0, Math.floor(parseInt(hex.substring(4, 6), 16) * (1 - amount)));
            return `rgb(${r},${g},${b})`;
        }

        function lightenColor(hex, amount) {
            hex = hex.replace('#', '');
            const r = Math.min(255, Math.floor(parseInt(hex.substring(0, 2), 16) + (255 - parseInt(hex.substring(0, 2), 16)) * amount));
            const g = Math.min(255, Math.floor(parseInt(hex.substring(2, 4), 16) + (255 - parseInt(hex.substring(2, 4), 16)) * amount));
            const b = Math.min(255, Math.floor(parseInt(hex.substring(4, 6), 16) + (255 - parseInt(hex.substring(4, 6), 16)) * amount));
            return `rgb(${r},${g},${b})`;
        }

        const gradientBarPlugin = {
            id: 'gradientBar',
            beforeDatasetsDraw: (chart) => {
                if (chart.config.type !== 'bar') return;
                const ctx = chart.ctx;
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    const baseColor = dataset.baseColor || dataset.borderColor || '#3498db';
                    meta.data.forEach((bar) => {
                        const gradient = ctx.createLinearGradient(bar.x - bar.width / 2, bar.y, bar.x + bar.width / 2, bar.base);
                        gradient.addColorStop(0, lightenColor(baseColor, 0.3));
                        gradient.addColorStop(0.5, baseColor);
                        gradient.addColorStop(1, darkenColor(baseColor, 0.2));
                        bar.options.backgroundColor = gradient;
                    });
                });
            }
        };

        // ========== FONT LOADING FOR CYRILLIC SUPPORT ==========
        async function loadPdfFonts(doc) {
            try {
                const [regularResp, boldResp] = await Promise.all([
                    fetch('/fonts/Roboto-Regular.ttf'),
                    fetch('/fonts/Roboto-Bold.ttf')
                ]);
                if (!regularResp.ok || !boldResp.ok) throw new Error('Font fetch failed');
                const [regularBuf, boldBuf] = await Promise.all([
                    regularResp.arrayBuffer(),
                    boldResp.arrayBuffer()
                ]);

                function arrayBufferToBase64(buffer) {
                    let binary = '';
                    const bytes = new Uint8Array(buffer);
                    for (let i = 0; i < bytes.byteLength; i++) {
                        binary += String.fromCharCode(bytes[i]);
                    }
                    return btoa(binary);
                }

                doc.addFileToVFS('Roboto-Regular.ttf', arrayBufferToBase64(regularBuf));
                doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
                doc.addFileToVFS('Roboto-Bold.ttf', arrayBufferToBase64(boldBuf));
                doc.addFont('Roboto-Bold.ttf', 'Roboto', 'bold');
                doc.setFont('Roboto', 'normal');
                return true;
            } catch (e) {
                console.warn('Could not load Cyrillic fonts, using default:', e);
                return false;
            }
        }

        async function exportToPDF() {
            if (requests.length === 0) { alert('Eksport qilish uchun murojaatlar mavjud emas!'); return; }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pw = doc.internal.pageSize.getWidth();
                const ph = doc.internal.pageSize.getHeight();
                const m = 14;
                const cw = pw - m * 2;
                const now = new Date();

                // Load Cyrillic fonts
                const hasCyrillic = await loadPdfFonts(doc);
                const fontName = hasCyrillic ? 'Roboto' : 'helvetica';

                // Stats
                const totalReqs = requests.length;
                const pendingReqs = requests.filter(r => r.status === 'pending').length;
                const studentReqs = requests.filter(r => r.status === 'student_responded').length;
                const answeredReqs = requests.filter(r => r.status === 'answered').length;
                const rejectedReqs = requests.filter(r => r.status === 'rejected').length;
                const uniqueUsers = new Set(requests.map(r => r.telegram_id)).size;
                const responseRate = totalReqs > 0 ? ((answeredReqs / totalReqs) * 100).toFixed(1) : '0';
                const avgResponseTime = (() => {
                    const ans = requests.filter(r => r.answered_at && r.created_at);
                    if (!ans.length) return 'N/A';
                    const hrs = ans.reduce((s, r) => s + (new Date(r.answered_at) - new Date(r.created_at)) / 3600000, 0) / ans.length;
                    if (hrs < 1) return `${Math.round(hrs * 60)} daqiqa`;
                    if (hrs < 24) return `${hrs.toFixed(1)} soat`;
                    return `${(hrs / 24).toFixed(1)} kun`;
                })();

                // Category data
                const categoryData = {};
                requests.forEach(r => { categoryData[r.category || 'Boshqa'] = (categoryData[r.category || 'Boshqa'] || 0) + 1; });
                const catEntries = Object.entries(categoryData).sort((a, b) => b[1] - a[1]);
                const catBarColors = ['#2980b9', '#c0392b', '#27ae60', '#f39c12', '#8e44ad', '#16a085', '#d35400', '#2c3e50', '#7f8c8d'];

                // ===== HELPERS =====
                function setFont(style) { doc.setFont(fontName, style || 'normal'); }
                function drawGradientRect(x, y, w, h, r1, g1, b1, r2, g2, b2) {
                    const steps = 40, stepH = h / steps;
                    for (let i = 0; i < steps; i++) {
                        const t = i / steps;
                        doc.setFillColor(Math.round(r1+(r2-r1)*t), Math.round(g1+(g2-g1)*t), Math.round(b1+(b2-b1)*t));
                        doc.rect(x, y + i * stepH, w, stepH + 0.5, 'F');
                    }
                }
                function addPageHeader(title) {
                    drawGradientRect(0, 0, pw, 22, 30, 45, 65, 45, 70, 100);

                    doc.setFillColor(r, g, b);
                    doc.rect(sx + 20, y + 12, Math.min(40, lineW - 25), 1.2, 'F');
                    // Thin fading line
                    doc.setFillColor(200, 210, 220);
                    doc.rect(sx + 20 + Math.min(40, lineW - 25) + 2, y + 12.3, lineW - Math.min(40, lineW - 25) - 25, 0.4, 'F');
                    return y + 18;
                }

                function drawSeparator(y) {
                    const cx = pw / 2;
                    // Left line
                    doc.setDrawColor(190, 200, 210); doc.setLineWidth(0.3);
                    doc.line(m + 25, y + 4, cx - 8, y + 4);
                    // Right line
                    doc.line(cx + 8, y + 4, pw - m - 25, y + 4);
                    // Center diamond
                    const d = 3;
                    doc.setFillColor(44, 62, 80);
                    doc.triangle(cx, y + 4 - d, cx + d, y + 4, cx, y + 4 + d, 'F');
                    doc.triangle(cx, y + 4 - d, cx - d, y + 4, cx, y + 4 + d, 'F');
                    return y + 12;
                }

                function drawChartFrame(x, y, w, h) {
                    // Shadow
                    doc.setFillColor(220, 225, 230);
                    doc.roundedRect(x + 1.5, y + 1.5, w, h, 4, 4, 'F');
                    // Card
                    doc.setFillColor(255, 255, 255);
                    doc.roundedRect(x, y, w, h, 4, 4, 'F');
                    // Thin border
                    doc.setDrawColor(220, 228, 236); doc.setLineWidth(0.4);
                    doc.roundedRect(x, y, w, h, 4, 4, 'S');
                }

                function hexToRgb(hex) {
                    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
                }

                function drawPdfLegend(cx, y, labels, colors, maxW) {
                    setFont('bold'); doc.setFontSize(7);
                    const dotR = 1.8;
                    const gap = 3;
                    const itemGap = 8;
                    // Calculate total width for centering
                    const items = labels.map((lbl, i) => {
                        const tw = doc.getTextWidth(lbl);
                        return { label: lbl, color: colors[i], textW: tw, totalW: dotR * 2 + gap + tw };
                    });
                    const totalW = items.reduce((s, it) => s + it.totalW, 0) + (items.length - 1) * itemGap;
                    let x = cx - totalW / 2;
                    if (x < 10) x = 10;
                    items.forEach((it) => {
                        const rgb = hexToRgb(it.color);
                        doc.setFillColor(...rgb);
                        doc.circle(x + dotR, y, dotR, 'F');
                        doc.setTextColor(70, 70, 70);
                        doc.text(it.label, x + dotR * 2 + gap, y + 1.2);
                        x += it.totalW + itemGap;
                    });
                }

                // ===== PAGE 2: CHARTS - HOLAT & YO'NALISHLAR =====
                doc.addPage();
                addPageHeader('INFOGRAFIKA - MUROJAATLAR TAHLILI');

                const chartW = (cw - 14) / 2;
                const chartH = chartW * 0.62;
                const rightChartX = m + chartW + 14;

                // Datalabels config
                const pctLabels = {
                    datalabels: {
                        color: '#fff', font: { size: 14, weight: 'bold' },
                        formatter: (val, ctx) => {
                            const sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                            const pct = ((val / sum) * 100).toFixed(0);
                            return val > 0 ? `${pct}%` : '';
                        },
                        textShadowColor: 'rgba(0,0,0,0.4)', textShadowBlur: 4
                    }
                };
                const barLabels = {
                    datalabels: {
                        anchor: 'end', align: 'top', color: '#333', font: { size: 13, weight: 'bold' },
                        formatter: (val) => val > 0 ? val : ''
                    }
                };

                // --- Section 01: Status Doughnut ---
                let secY = drawSectionHeader(28, 'MUROJAATLAR HOLATI', 1, 41, 128, 185);
                const statusColors = ['#e67e22', '#8e44ad', '#27ae60', '#c0392b'];
                const statusLabelsArr = ['Kutilmoqda', 'Student javobi', 'Javob berilgan', 'Rad etilgan'];
                const statusChart = await renderChart('statusChart', {
                    type: 'doughnut',
                    data: { labels: statusLabelsArr,
                        datasets: [{ data: [pendingReqs, studentReqs, answeredReqs, rejectedReqs], backgroundColor: statusColors, borderWidth: 3, borderColor: '#fff', offset: 2 }] },
                    options: { responsive: false, cutout: '55%', layout: { padding: 8 },
                        plugins: { ...pctLabels, title: { display: false }, legend: { display: false } } },
                    plugins: [shadow3DPlugin, doughnut3DPlugin, ChartDataLabels]
                });
                const legH = 8;
                drawChartFrame(m, secY, chartW, chartH + legH);
                doc.addImage(statusChart.toDataURL('image/png'), 'PNG', m + 2, secY + 2, chartW - 4, chartH - 4);
                drawPdfLegend(m + chartW / 2, secY + chartH + 1, statusLabelsArr, statusColors, chartW);

                // --- Section 02: Category Doughnut (beside status) ---
                drawSectionHeader(28, "YO'NALISHLAR BO'YICHA", 2, 142, 68, 173, rightChartX);
                const catLabelsArr = catEntries.map(e => e[0]);
                const catColorsArr = catBarColors.slice(0, catEntries.length);
                const categoryChart = await renderChart('categoryChart', {
                    type: 'doughnut',
                    data: { labels: catLabelsArr,
                        datasets: [{ data: catEntries.map(e => e[1]), backgroundColor: catColorsArr, borderWidth: 3, borderColor: '#fff', offset: 2 }] },
                    options: { responsive: false, cutout: '50%', layout: { padding: 8 },
                        plugins: { datalabels: { color: '#fff', font: { size: 12, weight: 'bold' },
                                formatter: (val, ctx) => { const sum = ctx.dataset.data.reduce((a,b) => a+b, 0); const p = ((val/sum)*100).toFixed(0); return val > 0 && p >= 5 ? `${p}%` : ''; } },
                            title: { display: false }, legend: { display: false } } },
                    plugins: [shadow3DPlugin, doughnut3DPlugin, ChartDataLabels]
                });
                drawChartFrame(rightChartX, secY, chartW, chartH + legH);
                doc.addImage(categoryChart.toDataURL('image/png'), 'PNG', rightChartX + 2, secY + 2, chartW - 4, chartH - 4);
                // Category legend - multi-row if many items
                const catLegY = secY + chartH + 1;
                const catPerRow = 3;
                for (let row = 0; row < Math.ceil(catLabelsArr.length / catPerRow); row++) {
                    const slice = catLabelsArr.slice(row * catPerRow, (row + 1) * catPerRow);
                    const sliceColors = catColorsArr.slice(row * catPerRow, (row + 1) * catPerRow);
                    drawPdfLegend(rightChartX + chartW / 2, catLegY + row * 4, slice, sliceColors, chartW);
                }

                // --- Separator ---
                let sepY = drawSeparator(secY + chartH + legH + 6);

                // --- Section 03: Monthly Bar Chart ---
                secY = drawSectionHeader(sepY, 'OYLIK DINAMIKA', 3, 39, 174, 96);
                const monthlyData = {};
                requests.forEach(r => {
                    const d = new Date(r.created_at);
                    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    if (!monthlyData[key]) monthlyData[key] = { answered: 0, pending: 0 };
                    if (r.status === 'answered') monthlyData[key].answered++; else monthlyData[key].pending++;
                });
                const sortedMonths = Object.keys(monthlyData).sort();
                const monthNames = ['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
                const monthLabels = sortedMonths.map(k => { const [y,mo] = k.split('-'); return `${monthNames[parseInt(mo)-1]} ${y}`; });

                const barChartH = 52;
                const barLegLabels = ['Javob berilgan', 'Kutilmoqda'];
                const barLegColors = ['#27ae60', '#e67e22'];
                const monthlyChart = await renderChart('monthlyChart', {
                    type: 'bar',
                    data: { labels: monthLabels, datasets: [
                        { label: barLegLabels[0], data: sortedMonths.map(k => monthlyData[k].answered), backgroundColor: '#27ae60', borderColor: '#1e8449', baseColor: '#27ae60', borderWidth: 1, borderRadius: 6, borderSkipped: false },
                        { label: barLegLabels[1], data: sortedMonths.map(k => monthlyData[k].pending), backgroundColor: '#e67e22', borderColor: '#d35400', baseColor: '#e67e22', borderWidth: 1, borderRadius: 6, borderSkipped: false }
                    ] },
                    options: { responsive: false,
                        plugins: { ...barLabels, title: { display: false }, legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 13 }, color: '#555' }, grid: { color: 'rgba(0,0,0,0.06)' } },
                            x: { ticks: { font: { size: 13 }, color: '#555' }, grid: { display: false } } } },
                    plugins: [shadow3DPlugin, gradientBarPlugin, ChartDataLabels]
                });
                drawChartFrame(m, secY, cw, barChartH + legH);
                doc.addImage(monthlyChart.toDataURL('image/png'), 'PNG', m + 2, secY + 2, cw - 4, barChartH - 4);
                drawPdfLegend(pw / 2, secY + barChartH + 1, barLegLabels, barLegColors, cw);

                // --- Separator ---
                sepY = drawSeparator(secY + barChartH + legH + 6);

                // --- Section 04: Type Pie ---
                secY = drawSectionHeader(sepY, 'MUROJAAT TURLARI', 4, 230, 126, 34);
                const typeData = {};
                const typeLabelsMap = { 'text': 'Matn', 'voice': 'Ovozli', 'video': 'Video', 'video_note': 'Video xabar', 'document': 'Fayl', 'photo': 'Rasm' };
                requests.forEach(r => { const t = typeLabelsMap[r.request_type] || r.request_type; typeData[t] = (typeData[t] || 0) + 1; });

                const typeLabelsArr = Object.keys(typeData);
                const typeColorsArr = ['#2980b9','#c0392b','#27ae60','#f39c12','#8e44ad','#16a085'].slice(0, typeLabelsArr.length);
                const typePieW = chartW + 10;
                const typePieH = typePieW * 0.55;
                const typeChart = await renderChart('typeChart', {
                    type: 'pie',
                    data: { labels: typeLabelsArr,
                        datasets: [{ data: Object.values(typeData), backgroundColor: typeColorsArr, borderWidth: 3, borderColor: '#fff', offset: 2 }] },
                    options: { responsive: false, layout: { padding: 8 },
                        plugins: { ...pctLabels, title: { display: false }, legend: { display: false } } },
                    plugins: [shadow3DPlugin, doughnut3DPlugin, ChartDataLabels]
                });
                const typeX = (pw - typePieW) / 2;
                drawChartFrame(typeX, secY, typePieW, typePieH + legH);
                doc.addImage(typeChart.toDataURL('image/png'), 'PNG', typeX + 2, secY + 2, typePieW - 4, typePieH - 4);
                drawPdfLegend(pw / 2, secY + typePieH + 1, typeLabelsArr, typeColorsArr, typePieW);
                addPageFooter(2);

                // ===== PAGE 3: USER STATS =====
                doc.addPage();
                addPageHeader('FOYDALANUVCHILAR STATISTIKASI');

                const userStats = {};
                requests.forEach(r => {
                    const uid = r.telegram_id;
                    if (!userStats[uid]) { userStats[uid] = { name: r.first_name || 'N/A', username: r.username || 'N/A', total: 0, answered: 0, pending: 0, blocked: r.blocked }; }
                    userStats[uid].total++;
                    if (r.status === 'answered') userStats[uid].answered++; else userStats[uid].pending++;
                });
                const userTableData = Object.values(userStats).sort((a, b) => b.total - a.total).map((u, i) => [
                    i + 1, u.name, `@${u.username}`, u.total, u.answered, u.pending, u.blocked ? 'BLOKLANGAN' : 'Aktiv'
                ]);

                doc.autoTable({
                    startY: 30,
                    head: [['#', 'Ism', 'Username', 'Jami', 'Javob', 'Kutilmoqda', 'Holat']],
                    body: userTableData,
                    theme: 'striped',
                    headStyles: { fillColor: [30, 45, 65], fontSize: 9, halign: 'center', cellPadding: 4, fontStyle: 'bold', font: fontName },
                    bodyStyles: { fontSize: 9, halign: 'center', cellPadding: 3.5, font: fontName },
                    columnStyles: { 0: { cellWidth: 10 }, 1: { cellWidth: 35, halign: 'left' }, 2: { cellWidth: 32, halign: 'left' }, 6: { cellWidth: 28 } },
                    alternateRowStyles: { fillColor: [240, 245, 250] },
                    styles: { lineColor: [200, 210, 220], lineWidth: 0.3, font: fontName },
                    didParseCell: function(data) {
                        if (data.section === 'body' && data.column.index === 6) {
                            if (data.cell.raw === 'BLOKLANGAN') { data.cell.styles.textColor = [192, 57, 43]; data.cell.styles.fontStyle = 'bold'; }
                            if (data.cell.raw === 'Aktiv') { data.cell.styles.textColor = [39, 174, 96]; data.cell.styles.fontStyle = 'bold'; }
                        }
                    }
                });
                addPageFooter(3);

                // ===== PAGE 4+: ALL REQUESTS =====
                doc.addPage();
                addPageHeader("BARCHA MUROJAATLAR RO'YXATI");

                const statusLabels = { 'pending': 'Kutilmoqda', 'student_responded': 'Student javobi', 'answered': 'Javob berilgan', 'rejected': 'Rad etilgan' };
                const tableData = requests.map((r, i) => [
                    i + 1, r.first_name || 'N/A', `@${r.username || 'N/A'}`, r.category || 'Boshqa',
                    (r.request_text || '').substring(0, 55) + ((r.request_text || '').length > 55 ? '...' : ''),
                    statusLabels[r.status] || r.status, new Date(r.created_at).toLocaleDateString('uz-UZ'), r.responded_by || '-'
                ]);

                let currentPage = 4;
                doc.autoTable({
                    startY: 30,
                    head: [['#', 'Ism', 'Username', "Yo'nalish", 'Murojaat', 'Status', 'Sana', 'Javob berdi']],
                    body: tableData,
                    theme: 'striped',
                    headStyles: { fillColor: [30, 45, 65], fontSize: 8, halign: 'center', cellPadding: 3.5, fontStyle: 'bold', font: fontName },
                    bodyStyles: { fontSize: 7.5, cellPadding: 3, font: fontName },
                    columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 1: { cellWidth: 22 }, 2: { cellWidth: 22 }, 3: { cellWidth: 24 },
                        4: { cellWidth: 48 }, 5: { cellWidth: 22, halign: 'center' }, 6: { cellWidth: 18, halign: 'center' }, 7: { cellWidth: 22 } },
                    alternateRowStyles: { fillColor: [245, 248, 252] },
                    styles: { lineColor: [200, 210, 220], lineWidth: 0.2, font: fontName },
                    didParseCell: function(data) {
                        if (data.section === 'body' && data.column.index === 5) {
                            const v = data.cell.raw;
                            if (v === 'Kutilmoqda') { data.cell.styles.textColor = [230, 126, 34]; data.cell.styles.fontStyle = 'bold'; }
                            else if (v === 'Student javobi') { data.cell.styles.textColor = [142, 68, 173]; data.cell.styles.fontStyle = 'bold'; }
                            else if (v === 'Javob berilgan') { data.cell.styles.textColor = [39, 174, 96]; data.cell.styles.fontStyle = 'bold'; }
                            else if (v === 'Rad etilgan') { data.cell.styles.textColor = [192, 57, 43]; data.cell.styles.fontStyle = 'bold'; }
                        }
                    },
                    didDrawPage: function() { addPageFooter(currentPage); currentPage++; },
                    margin: { top: 30 }
                });

                doc.save(`Dictum_Hisobot_${now.toISOString().split('T')[0]}.pdf`);
            } catch (error) {
                console.error('PDF export error:', error);
                alert('PDF eksport xatolik bilan yakunlandi: ' + error.message);
            }
        }

        // Render Chart.js chart with optional plugins
        async function renderChart(canvasId, config) {
            // Ensure Roboto font is loaded for canvas rendering
            if (!window._chartFontLoaded) {
                try {
                    await document.fonts.load('16px Roboto');
                    await document.fonts.load('bold 16px Roboto');
                } catch(e) { /* fallback to system fonts */ }
                Chart.defaults.font.family = "'Roboto', 'Segoe UI', Arial, sans-serif";
                window._chartFontLoaded = true;
            }
            return new Promise((resolve) => {
                const canvas = document.getElementById(canvasId);
                const ctx = canvas.getContext('2d');
                const existingChart = Chart.getChart(canvas);
                if (existingChart) existingChart.destroy();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                config.options = config.options || {};
                config.options.animation = false;
                config.options.devicePixelRatio = 2;
                const extraPlugins = config.plugins || [];
                delete config.plugins;
                new Chart(ctx, { ...config, plugins: extraPlugins });
                setTimeout(() => resolve(canvas), 600);
            });
        }
        
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login.html';
            } catch (error) {
                window.location.href = '/login.html';
            }
        }
        
        function closeModal() {
            document.getElementById('requestModal').style.display = 'none';
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('requestModal');
            if (event.target === modal) {
                closeModal();
            }
        }
        
        // Set default filter to "Kutilmoqda"
        document.getElementById('statusFilter').value = 'pending';

        loadUserInfo();
        loadAdmins();
        loadRequests();
        setInterval(loadRequests, 30000);
    </script>
</body>
