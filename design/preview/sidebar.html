<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.nav{display:flex;flex-direction:column;width:240px;background:var(--parchment-50);border:1px solid var(--border-1);border-radius:14px;padding:10px}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font:500 13px/1 var(--font-sans);color:var(--fg-2);cursor:pointer;transition:background .15s}

.item.active .ic{border-color:var(--brass-300)}
.section{font:700 10px/1 var(--font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);padding:14px 12px 6px}
